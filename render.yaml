services:
  # ── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: navig-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: navig-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ANTHROPIC_API_KEY
        sync: false          # You fill this in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Fill with your Vercel URL after deploy e.g. https://navig.vercel.app

databases:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - name: navig-db
    plan: free
    databaseName: navig
    user: navig_user
