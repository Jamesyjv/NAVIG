name: NAVIG CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint, Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  # ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Type-check, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      ENV: development
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: ci-test-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ANTHROPIC_API_KEY: ""          # AI calls will use mock fallbacks in CI
      ALLOWED_ORIGINS: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff pytest httpx

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q --tb=short
        working-directory: ${{ github.workspace }}

  # ────────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (frontend)
        run: npm audit --audit-level=high
        working-directory: app
        continue-on-error: true   # report but don't block until fixed

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true
